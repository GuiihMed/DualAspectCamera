<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>DualAspect Camera Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .crop-border-dashed {
      border-style: dashed;
      border-width: 1px;
    }
    .flash-anim {
      animation: flashEffect 0.25s ease-out;
    }
    @keyframes flashEffect {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body class="bg-black text-white h-screen w-screen relative overflow-hidden select-none">

  <!-- FEED REAL DA CÂMERA -->
  <video id="cameraFeed" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover z-0 transition-transform duration-300"></video>
  <canvas id="photoCanvas" class="hidden"></canvas>
  <div id="flashOverlay" class="absolute inset-0 bg-white pointer-events-none opacity-0 z-40"></div>

  <!-- OVERLAY DE GUIAS ADAPTATIVAS (16:9 + 9:16) -->
  <div id="cropGuidesContainer" class="absolute inset-0 pointer-events-none z-10 flex flex-col items-center justify-center"></div>

  <!-- SLIDER LATERAL DE CONTROLE DE LUZ (2px, interativo) -->
  <div id="exposureContainer" class="absolute right-4 top-1/2 -translate-y-1/2 z-30 flex items-center py-6 px-3 cursor-pointer pointer-events-auto touch-none">
    <div class="relative h-44 flex items-center justify-center">
      <div id="evLabel" class="absolute right-8 text-[9px] font-mono font-bold bg-black/80 px-1.5 py-0.5 rounded-full border border-white/20 opacity-0 transition-opacity whitespace-nowrap">0.0 EV</div>
      <div id="exposureTrack" class="w-[2px] bg-white opacity-15 rounded-full h-full transition-all duration-200"></div>
      <div id="exposureThumb" class="absolute top-1/2 -translate-x-1/2 -translate-y-1/2 p-1.5 rounded-full bg-white/20 backdrop-blur-xl border border-white/30 opacity-70 scale-90 transition-transform">
        <i data-lucide="sun" class="w-3.5 h-3.5 text-white"></i>
      </div>
    </div>
  </div>

  <!-- PAINEL SUPERIOR CONSOLIDADO (DROPDOWN DE QUALIDADE, VU METER, TOGGLES) -->
  <header class="absolute top-4 inset-x-0 mx-auto w-fit z-30 pointer-events-auto">
    <div class="flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-white/[0.06] backdrop-blur-2xl border border-white/10 shadow-2xl">
      <!-- Seletor de Qualidade -->
      <div class="relative">
        <button id="btnQuality" class="flex items-center gap-1.5 text-[10px] font-mono font-bold tracking-tight text-white/90 px-2 py-0.5 rounded-full bg-white/10">
          <span id="qualityLabel">4K UHD · 30FPS</span>
          <i data-lucide="chevron-down" class="w-3 h-3 opacity-60"></i>
        </button>
        <!-- Dropdown Menu -->
        <div id="qualityMenu" class="hidden absolute top-8 left-0 w-36 bg-neutral-900/95 backdrop-blur-xl border border-white/15 rounded-xl p-1 shadow-2xl z-50 text-[10px] font-mono">
          <div class="px-2 py-1 text-white/40 text-[9px] uppercase font-bold">Resolução</div>
          <button data-res="4K" class="quality-item w-full text-left px-2 py-1.5 rounded hover:bg-white/10 text-white font-bold flex justify-between">4K UHD <span>✓</span></button>
          <button data-res="1080p" class="quality-item w-full text-left px-2 py-1.5 rounded hover:bg-white/10 text-white/80 flex justify-between">1080p FHD <span></span></button>
          <button data-res="720p" class="quality-item w-full text-left px-2 py-1.5 rounded hover:bg-white/10 text-white/80 flex justify-between">720p HD <span></span></button>
          <div class="h-[1px] bg-white/10 my-1"></div>
          <div class="px-2 py-1 text-white/40 text-[9px] uppercase font-bold">Taxa (FPS)</div>
          <button data-fps="60" class="fps-item w-full text-left px-2 py-1.5 rounded hover:bg-white/10 text-white/80 flex justify-between">60 FPS <span></span></button>
          <button data-fps="30" class="fps-item w-full text-left px-2 py-1.5 rounded hover:bg-white/10 text-white font-bold flex justify-between">30 FPS <span>✓</span></button>
          <button data-fps="24" class="fps-item w-full text-left px-2 py-1.5 rounded hover:bg-white/10 text-white/80 flex justify-between">24 FPS (Cine) <span></span></button>
        </div>
      </div>

      <!-- Timer quando gravando (oculto em repouso) -->
      <div id="recordingTimerBadge" class="hidden items-center gap-1.5 px-2 py-0.5 rounded-full bg-red-500/20 border border-red-500/40 text-[10px] font-mono font-bold text-white">
        <div class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></div>
        <span id="timecodeTop">00:00</span>
      </div>

      <div class="w-[1px] h-3 bg-white/15"></div>

      <!-- Microfone & VU Meter Real -->
      <div class="flex items-center gap-1.5">
        <i data-lucide="mic" class="w-3 h-3 text-white/80"></i>
        <div class="flex items-end gap-[1.5px] h-2.5 w-2.5">
          <div id="vu1" class="w-[2px] bg-white rounded-full h-[33%] opacity-100 transition-all duration-75"></div>
          <div id="vu2" class="w-[2px] bg-white rounded-full h-[66%] opacity-30 transition-all duration-75"></div>
          <div id="vu3" class="w-[2px] bg-white rounded-full h-[100%] opacity-30 transition-all duration-75"></div>
        </div>
      </div>

      <div class="w-[1px] h-3 bg-white/15"></div>

      <!-- Toggles: Grade, Lanterna, Trocar Câmera -->
      <div class="flex items-center gap-2">
        <button id="btnGrid" class="p-1 rounded-full text-white opacity-100 hover:opacity-100 transition-opacity" title="Grade">
          <i data-lucide="grid-3x3" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btnTorch" class="p-1 rounded-full text-white opacity-40 hover:opacity-100 transition-opacity" title="Lanterna">
          <i data-lucide="flashlight" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btnFlip" class="p-1 rounded-full text-white opacity-80 hover:opacity-100 transition-opacity" title="Trocar Câmera">
          <i data-lucide="switch-camera" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- DISCADOR DE ZOOM INTERATIVO (0.5x Ultra-Wide a 5x com régua de precisão) -->
  <aside class="absolute bottom-24 inset-x-0 mx-auto w-fit z-30 pointer-events-auto flex flex-col items-center gap-1.5 touch-none">
    <!-- Régua / Indicador Flutuante ao Arrastar -->
    <div id="zoomRulerContainer" class="opacity-0 transition-opacity duration-200 flex flex-col items-center gap-1 pointer-events-none">
      <div id="zoomFloatLabel" class="font-mono text-[13px] font-bold px-2.5 py-0.5 rounded-full bg-black/80 border border-white/20 text-white">1.0×</div>
      <div class="flex items-center gap-1 h-3 opacity-60">
        <div class="w-[1px] h-2 bg-white/40"></div>
        <div class="w-[1px] h-3 bg-white"></div>
        <div class="w-[1px] h-2 bg-white/40"></div>
        <div class="w-[1px] h-4 bg-white"></div>
        <div class="w-[1px] h-2 bg-white/40"></div>
        <div class="w-[1px] h-3 bg-white"></div>
        <div class="w-[1px] h-2 bg-white/40"></div>
      </div>
    </div>

    <!-- Pílula de Lentes [.5] [1] [2] [3] [5] -->
    <div id="zoomDialPill" class="flex items-center gap-1 rounded-full bg-white/[0.08] backdrop-blur-2xl border border-white/12 p-1 shadow-2xl">
      <button data-zoom="0.5" class="zoom-btn w-7 h-7 rounded-full font-mono text-[10px] text-white/80 hover:text-white flex items-center justify-center transition-all">.5</button>
      <button data-zoom="1.0" class="zoom-btn w-7 h-7 rounded-full font-mono text-[10px] bg-white text-black font-bold flex items-center justify-center transition-all">1</button>
      <button data-zoom="2.0" class="zoom-btn w-7 h-7 rounded-full font-mono text-[10px] text-white/80 hover:text-white flex items-center justify-center transition-all">2</button>
      <button data-zoom="3.0" class="zoom-btn w-7 h-7 rounded-full font-mono text-[10px] text-white/80 hover:text-white flex items-center justify-center transition-all">3</button>
      <button data-zoom="5.0" class="zoom-btn w-7 h-7 rounded-full font-mono text-[10px] text-white/80 hover:text-white flex items-center justify-center transition-all">5</button>
    </div>
  </aside>

  <!-- CONTROLO PRINCIPAL (CARROSSEL, SHUTTER, FOTO RÁPIDA, GALERIA) -->
  <footer class="absolute bottom-6 inset-x-0 z-30 flex flex-col items-center gap-4 pointer-events-auto">
    <!-- Carrossel de Modos: FOTO | VÍDEO | CINE -->
    <nav class="flex items-center gap-6">
      <button class="mode-btn flex flex-col items-center gap-1 text-white/40 font-mono text-[11px] tracking-widest uppercase" data-mode="FOTO">
        <span>FOTO</span>
        <div class="w-1 h-1 rounded-full bg-transparent"></div>
      </button>
      <button class="mode-btn flex flex-col items-center gap-1 text-white font-bold font-mono text-[11px] tracking-widest uppercase" data-mode="VÍDEO">
        <span>VÍDEO</span>
        <div class="w-1 h-1 rounded-full bg-white"></div>
      </button>
      <button class="mode-btn flex flex-col items-center gap-1 text-white/40 font-mono text-[11px] tracking-widest uppercase" data-mode="CINE">
        <span>CINE</span>
        <div class="w-1 h-1 rounded-full bg-transparent"></div>
      </button>
    </nav>

    <!-- Tríade de Captura -->
    <div class="w-full max-w-xs px-6 flex items-center justify-between">
      <!-- Miniatura Galeria -->
      <button id="btnGallery" class="w-11 h-11 rounded-xl bg-white/[0.06] backdrop-blur-xl border border-white/20 p-0.5 flex items-center justify-center hover:opacity-80 active:scale-95 transition-all overflow-hidden" title="Galeria">
        <div id="galleryThumbContainer" class="w-full h-full rounded-[10px] bg-neutral-900 flex items-center justify-center">
          <i data-lucide="image" class="w-4 h-4 text-white/70"></i>
        </div>
      </button>

      <!-- Botão Central (Obturador Foto ou Vídeo REC) -->
      <div class="flex flex-col items-center gap-1">
        <button id="shutterBtn" class="relative w-18 h-18 rounded-full border-2 border-white/85 p-1 flex items-center justify-center active:scale-95 transition-all">
          <div id="shutterCore" class="w-14 h-14 rounded-full bg-white transition-all duration-300"></div>
        </button>
      </div>

      <!-- Botão Foto Rápida / Trocar -->
      <button id="btnQuickPhoto" class="w-11 h-11 rounded-full bg-white/[0.06] backdrop-blur-xl border border-white/20 flex items-center justify-center hover:bg-white/10 active:scale-90 transition-all" title="Foto Rápida">
        <i data-lucide="camera" class="w-4 h-4 text-white"></i>
      </button>
    </div>
  </footer>

  <!-- Toast de Notificação -->
  <div id="toastMessage" class="absolute bottom-24 inset-x-0 mx-auto w-fit px-3 py-1.5 rounded-full bg-neutral-900/90 border border-white/20 text-[11px] font-medium text-white shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>

  <script>
    lucide.createIcons();

    const video = document.getElementById('cameraFeed');
    const photoCanvas = document.getElementById('photoCanvas');
    const flashOverlay = document.getElementById('flashOverlay');
    const toast = document.getElementById('toastMessage');

    let videoStream = null;
    let audioContext = null;
    let analyser = null;
    let activeFacingMode = 'environment';
    let currentMode = 'VÍDEO';
    let activeResolution = '4K';
    let activeFPS = 30;
    let zoomLevel = 1.0;
    let exposureVal = 0.5;

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 2500);
    }

    // 1. Inicializar Câmera
    async function initCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: activeFacingMode,
            width: { ideal: activeResolution === '4K' ? 3840 : (activeResolution === '1080p' ? 1920 : 1280) },
            height: { ideal: activeResolution === '4K' ? 2160 : (activeResolution === '1080p' ? 1080 : 720) },
            frameRate: { ideal: activeFPS }
          },
          audio: true
        });
        video.srcObject = stream;
        videoStream = stream;
        initAudioVU(stream);
        applyZoom(zoomLevel);
        applyExposure(exposureVal);
      } catch (err) {
        console.warn('Erro ao inicializar câmera:', err);
        try {
          const fallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          video.srcObject = fallback;
          videoStream = fallback;
          initAudioVU(fallback);
        } catch (e) {
          showToast('Permissão de câmera negada');
        }
      }
    }

    // 2. VU Meter Real de Áudio
    function initAudioVU(stream) {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const vu1 = document.getElementById('vu1');
        const vu2 = document.getElementById('vu2');
        const vu3 = document.getElementById('vu3');

        function updateVU() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          const avg = sum / dataArray.length / 255;
          vu1.style.opacity = avg > 0.05 ? '1' : '0.3';
          vu2.style.opacity = avg > 0.25 ? '1' : '0.3';
          vu3.style.opacity = avg > 0.55 ? '1' : '0.3';
          requestAnimationFrame(updateVU);
        }
        updateVU();
      } catch (e) {
        console.warn('Web Audio offline:', e);
      }
    }

    // 3. Controle de Luz / Exposição
    const expContainer = document.getElementById('exposureContainer');
    const expTrack = document.getElementById('exposureTrack');
    const expThumb = document.getElementById('exposureThumb');
    const evLabel = document.getElementById('evLabel');

    function applyExposure(val) {
      exposureVal = val;
      // Map 0.0 (dark) -> 0.5 (neutral) -> 1.0 (bright)
      // Visual feedback via video brightness filter and EV text
      const brightnessFactor = (val * 1.6 + 0.2).toFixed(2);
      video.style.filter = `brightness(${brightnessFactor})`;
      const ev = ((val - 0.5) * 4.0).toFixed(1);
      evLabel.innerText = `${ev > 0 ? '+' : ''}${ev} EV`;
    }

    let isDraggingExp = false;
    expContainer.addEventListener('pointerdown', (e) => {
      isDraggingExp = true;
      expTrack.className = 'w-[4px] bg-white opacity-90 rounded-full h-full shadow-[0_0_10px_rgba(255,255,255,0.7)] transition-all';
      evLabel.style.opacity = '1';
      handleExpMove(e);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDraggingExp) return;
      handleExpMove(e);
    });

    window.addEventListener('pointerup', () => {
      if (!isDraggingExp) return;
      isDraggingExp = false;
      expTrack.className = 'w-[2px] bg-white opacity-15 rounded-full h-full transition-all duration-200';
      setTimeout(() => { evLabel.style.opacity = '0'; }, 600);
    });

    function handleExpMove(e) {
      const rect = expContainer.getBoundingClientRect();
      const clampedY = Math.max(0, Math.min(e.clientY - rect.top, rect.height));
      const normalized = 1.0 - (clampedY / rect.height);
      expThumb.style.top = `${clampedY}px`;
      applyExposure(normalized);
    }

    // 4. Zoom Interativo (Lentes .5, 1, 2, 3, 5 + Scrubbing de Precisão)
    const zoomFloatLabel = document.getElementById('zoomFloatLabel');
    const zoomRulerContainer = document.getElementById('zoomRulerContainer');
    const zoomDialPill = document.getElementById('zoomDialPill');
    let zoomDismissTimer = null;

    function applyZoom(factor) {
      zoomLevel = parseFloat(factor.toFixed(1));
      zoomFloatLabel.innerText = `${zoomLevel}×`;

      if (videoStream) {
        const track = videoStream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.zoom) {
          track.applyConstraints({ advanced: [{ zoom: zoomLevel }] }).catch(() => {});
        } else {
          video.style.transform = `scale(${Math.max(0.7, zoomLevel)})`;
        }
      }

      // Atualizar destaque dos botões
      document.querySelectorAll('.zoom-btn').forEach(btn => {
        const val = parseFloat(btn.getAttribute('data-zoom'));
        if (Math.abs(val - zoomLevel) < 0.15) {
          btn.className = 'zoom-btn w-7 h-7 rounded-full font-mono text-[10px] bg-white text-black font-bold flex items-center justify-center transition-all scale-105';
        } else {
          btn.className = 'zoom-btn w-7 h-7 rounded-full font-mono text-[10px] text-white/80 hover:text-white flex items-center justify-center transition-all';
        }
      });
    }

    document.querySelectorAll('.zoom-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const z = parseFloat(btn.getAttribute('data-zoom'));
        applyZoom(z);
      });
    });

    // Arrastar sobre o dial para zoom contínuo de precisão
    let isScrubbingDial = false;
    let scrubStartX = 0;
    let scrubStartZoom = 1.0;

    zoomDialPill.addEventListener('pointerdown', (e) => {
      isScrubbingDial = true;
      scrubStartX = e.clientX;
      scrubStartZoom = zoomLevel;
      zoomRulerContainer.style.opacity = '1';
      clearTimeout(zoomDismissTimer);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isScrubbingDial) return;
      const deltaX = e.clientX - scrubStartX;
      const speed = scrubStartZoom > 3 ? 0.04 : (scrubStartZoom > 1.5 ? 0.025 : 0.015);
      let target = Math.min(Math.max(scrubStartZoom + (deltaX * speed), 0.5), 10.0);
      applyZoom(target);
    });

    window.addEventListener('pointerup', () => {
      if (!isScrubbingDial) return;
      isScrubbingDial = false;
      zoomDismissTimer = setTimeout(() => {
        zoomRulerContainer.style.opacity = '0';
      }, 1200);
    });

    // 5. Trocar Câmera (Front/Back)
    document.getElementById('btnFlip').addEventListener('click', () => {
      activeFacingMode = activeFacingMode === 'environment' ? 'user' : 'environment';
      initCamera();
      showToast(activeFacingMode === 'environment' ? 'Câmera Traseira' : 'Câmera Frontal');
    });

    // 6. Seleção de Modos: FOTO | VÍDEO | CINE
    const shutterBtn = document.getElementById('shutterBtn');
    const shutterCore = document.getElementById('shutterCore');

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.getAttribute('data-mode');
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => {
          b.classList.remove('text-white', 'font-bold');
          b.classList.add('text-white/40');
          b.querySelector('div').className = 'w-1 h-1 rounded-full bg-transparent';
        });
        btn.classList.remove('text-white/40');
        btn.classList.add('text-white', 'font-bold');
        btn.querySelector('div').className = 'w-1 h-1 rounded-full bg-white';

        if (mode === 'CINE') {
          activeFPS = 24;
          updateQualityLabel();
          initCamera();
          showToast('Modo Cinema (24 FPS)');
        } else if (mode === 'FOTO') {
          shutterCore.className = 'w-14 h-14 rounded-full bg-white transition-all duration-300';
          showToast('Modo Foto');
        } else {
          activeFPS = 30;
          updateQualityLabel();
          showToast('Modo Vídeo (30 FPS)');
        }
        renderCropGuides(window.innerWidth > window.innerHeight);
      });
    });

    // 7. Captura de Foto Real (Canvas Stills)
    function capturePhoto() {
      flashOverlay.style.opacity = '0.9';
      setTimeout(() => { flashOverlay.style.opacity = '0'; }, 180);

      const w = video.videoWidth || 1920;
      const h = video.videoHeight || 1080;
      photoCanvas.width = w;
      photoCanvas.height = h;
      const ctx = photoCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      photoCanvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `DualCam_Photo_${Date.now()}.jpg`;
        a.click();

        // Atualizar miniatura da galeria
        const thumbContainer = document.getElementById('galleryThumbContainer');
        thumbContainer.innerHTML = `<img src="${url}" class="w-full h-full object-cover rounded-[10px]" />`;
        showToast('Foto salva!');
      }, 'image/jpeg', 0.95);
    }

    document.getElementById('btnQuickPhoto').addEventListener('click', capturePhoto);

    // 8. Gravação de Vídeo Real
    let isRecording = false;
    let recSeconds = 0;
    let recTimer = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    const recordingTimerBadge = document.getElementById('recordingTimerBadge');
    const timecodeTop = document.getElementById('timecodeTop');

    shutterBtn.addEventListener('click', () => {
      if (currentMode === 'FOTO') {
        capturePhoto();
        return;
      }

      isRecording = !isRecording;
      if (isRecording) {
        // Gravar
        shutterCore.className = 'w-7 h-7 rounded-[6px] bg-red-500 transition-all duration-300';
        recordingTimerBadge.classList.remove('hidden');
        recordingTimerBadge.classList.add('flex');
        recSeconds = 0;
        timecodeTop.innerText = '00:00';

        recTimer = setInterval(() => {
          recSeconds++;
          const m = Math.floor(recSeconds / 60).toString().padStart(2, '0');
          const s = (recSeconds % 60).toString().padStart(2, '0');
          timecodeTop.innerText = `${m}:${s}`;
        }, 1000);

        if (videoStream) {
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(videoStream, { mimeType: 'video/webm;codecs=vp8,opus' });
          mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `DualCam_${currentMode === 'CINE' ? 'Cine_24fps' : 'Video'}_${Date.now()}.webm`;
            a.click();
            showToast('Vídeo salvo na Galeria!');
          };
          mediaRecorder.start();
        }
      } else {
        // Parar
        shutterCore.className = 'w-14 h-14 rounded-full bg-white transition-all duration-300';
        recordingTimerBadge.classList.add('hidden');
        recordingTimerBadge.classList.remove('flex');
        clearInterval(recTimer);
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      }
    });

    // 9. Dropdown de Qualidade
    const btnQuality = document.getElementById('btnQuality');
    const qualityMenu = document.getElementById('qualityMenu');
    btnQuality.addEventListener('click', () => {
      qualityMenu.classList.toggle('hidden');
    });

    function updateQualityLabel() {
      document.getElementById('qualityLabel').innerText = `${activeResolution} UHD · ${activeFPS}FPS`;
    }

    document.querySelectorAll('.quality-item').forEach(btn => {
      btn.addEventListener('click', () => {
        activeResolution = btn.getAttribute('data-res');
        updateQualityLabel();
        qualityMenu.classList.add('hidden');
        initCamera();
        showToast(`Qualidade: ${activeResolution}`);
      });
    });

    document.querySelectorAll('.fps-item').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFPS = parseInt(btn.getAttribute('data-fps'), 10);
        updateQualityLabel();
        qualityMenu.classList.add('hidden');
        initCamera();
        showToast(`Taxa: ${activeFPS} FPS`);
      });
    });

    // 10. Botão Galeria
    document.getElementById('btnGallery').addEventListener('click', () => {
      showToast('Abrindo downloads/galeria...');
    });

    // 11. Guias de Corte
    let showGrid = true;
    document.getElementById('btnGrid').addEventListener('click', () => {
      showGrid = !showGrid;
      renderCropGuides(window.innerWidth > window.innerHeight);
    });

    function renderCropGuides(isLandscape) {
      const container = document.getElementById('cropGuidesContainer');
      if (isLandscape) {
        container.innerHTML = `
          <div class="w-full h-full flex items-center justify-center">
            <div class="h-full flex-1 bg-black/30 backdrop-blur-[0.5px]"></div>
            <div class="relative h-full aspect-[9/16] border-x border-white/30 crop-border-dashed flex items-center justify-center">
              ${renderCornerBrackets()}
              ${renderReticle()}
              ${showGrid ? renderGrid() : ''}
              <span class="absolute top-4 px-2 py-0.5 rounded-full bg-white/[0.08] backdrop-blur-md border border-white/10 text-[9px] font-mono tracking-widest text-white/70">
                9:16
              </span>
            </div>
            <div class="h-full flex-1 bg-black/30 backdrop-blur-[0.5px]"></div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center">
            <div class="w-full flex-1 bg-black/30 backdrop-blur-[0.5px]"></div>
            <div class="relative w-full aspect-[16/9] border-y border-white/30 crop-border-dashed flex items-center justify-center">
              ${renderCornerBrackets()}
              ${renderReticle()}
              ${showGrid ? renderGrid() : ''}
              <span class="absolute top-2 left-4 px-2 py-0.5 rounded-full bg-white/[0.08] backdrop-blur-md border border-white/10 text-[9px] font-mono tracking-widest text-white/70">
                16:9
              </span>
            </div>
            <div class="w-full flex-1 bg-black/30 backdrop-blur-[0.5px]"></div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function renderCornerBrackets() {
      return `
        <div class="absolute top-3 left-3 w-3 h-3 border-t-2 border-l-2 border-white/70 pointer-events-none"></div>
        <div class="absolute top-3 right-3 w-3 h-3 border-t-2 border-r-2 border-white/70 pointer-events-none"></div>
        <div class="absolute bottom-3 left-3 w-3 h-3 border-b-2 border-l-2 border-white/70 pointer-events-none"></div>
        <div class="absolute bottom-3 right-3 w-3 h-3 border-b-2 border-r-2 border-white/70 pointer-events-none"></div>
      `;
    }

    function renderReticle() {
      return `
        <div class="relative w-4 h-4 opacity-40 pointer-events-none">
          <div class="absolute top-1/2 left-0 w-1.5 h-[1px] bg-white -translate-y-1/2"></div>
          <div class="absolute top-1/2 right-0 w-1.5 h-[1px] bg-white -translate-y-1/2"></div>
          <div class="absolute top-0 left-1/2 h-1.5 w-[1px] bg-white -translate-x-1/2"></div>
          <div class="absolute bottom-0 left-1/2 h-1.5 w-[1px] bg-white -translate-x-1/2"></div>
        </div>
      `;
    }

    function renderGrid() {
      return `
        <div class="absolute inset-0 grid grid-cols-3 grid-rows-3 opacity-20 pointer-events-none">
          <div class="border-r border-b border-white/40 border-dashed"></div>
          <div class="border-r border-b border-white/40 border-dashed"></div>
          <div class="border-b border-white/40 border-dashed"></div>
          <div class="border-r border-b border-white/40 border-dashed"></div>
          <div class="border-r border-b border-white/40 border-dashed"></div>
          <div class="border-b border-white/40 border-dashed"></div>
          <div class="border-r border-b border-white/40 border-dashed"></div>
          <div class="border-r border-b border-white/40 border-dashed"></div>
          <div></div>
        </div>
      `;
    }

    window.addEventListener('resize', () => renderCropGuides(window.innerWidth > window.innerHeight));

    initCamera();
    renderCropGuides(window.innerWidth > window.innerHeight);
  </script>
</body>
</html>
