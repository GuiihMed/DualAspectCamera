name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" DualAspectCamera.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualAspectCamera-apk
          path: DualAspectCamera.apk
          retention-days: 7

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "DualAspectCamera Latest"
          draft: false
          prerelease: false
          files: DualAspectCamera.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
