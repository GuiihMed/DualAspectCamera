name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build DualAspectCamera.app
        run: |
          xcodebuild build \
            -project DualAspectCamera.xcodeproj \
            -scheme DualAspectCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into IPA
        run: |
          APP_PATH=$(find ./build/DerivedData -name "DualAspectCamera.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: DualAspectCamera.app not found"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DualAspectCamera.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualAspectCamera-ipa
          path: DualAspectCamera.ipa
          retention-days: 7
