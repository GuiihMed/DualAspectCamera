name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build DualAspectCamera.app
        run: |
          set -o pipefail
          xcodebuild build \
            -project DualAspectCamera.xcodeproj \
            -scheme DualAspectCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log

      - name: Show Build Errors
        if: failure()
        run: |
          echo "=== EXTRACTED COMPILER ERRORS ==="
          grep -E "(: error:|\*\* BUILD FAILED \*\*)" xcodebuild.log -A 2 -B 1 || true
          echo "=== LAST 120 LINES OF BUILD LOG ==="
          tail -n 120 xcodebuild.log

      - name: Package Payload into IPA
        run: |
          APP_PATH=$(find ./build/DerivedData -name "DualAspectCamera.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: DualAspectCamera.app not found"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r DualAspectCamera.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualAspectCamera-ipa
          path: DualAspectCamera.ipa
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "DualAspectCamera Latest IPA"
          draft: false
          prerelease: false
          files: DualAspectCamera.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
