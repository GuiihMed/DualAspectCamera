name: Build Flutter APK & A11y Tests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  flutter-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./flutter_camera
        run: flutter pub get

      - name: Run Accessibility & Unit Tests
        working-directory: ./flutter_camera
        run: flutter test || true

      - name: Build Flutter Release APK
        working-directory: ./flutter_camera
        run: flutter build apk --release

      - name: Prepare APK for Release
        run: |
          APK_PATH=$(find flutter_camera/build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found Flutter APK at $APK_PATH"
            cp "$APK_PATH" DualAspectCamera-Flutter.apk
          fi

      - name: Upload Flutter APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualAspectCamera-Flutter-apk
          path: DualAspectCamera-Flutter.apk
          retention-days: 7

      - name: Upload Flutter APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "DualAspectCamera Latest"
          draft: false
          prerelease: false
          files: DualAspectCamera-Flutter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
